    <text y="61" class="body">Expansion</text><rect x="126" y="45" width="493" height="23" rx="6" fill="#e9ecf8"/><rect x="126" y="45" width="212" height="23" rx="6" fill="#64b7b0"/><text x="353" y="62" class="sm" fill="#3f928c">+164</text>
    <text y="104" class="body">Pricing</text><rect x="126" y="88" width="493" height="23" rx="6" fill="#e9ecf8"/><rect x="126" y="88" width="130" height="23" rx="6" fill="#e66d50"/><text x="271" y="105" class="sm" fill="#be513a">+101</text>
    <text y="147" class="body">All other</text><rect x="126" y="131" width="493" height="23" rx="6" fill="#e9ecf8"/><rect x="126" y="131" width="204" height="23" rx="6" fill="#aeb6c6"/><text x="345" y="148" class="sm muted">+158</text>
    <text x="126" y="188" class="sm muted">0</text><text x="246" y="188" class="sm muted">100</text><text x="366" y="188" class="sm muted">200</text><text x="486" y="188" class="sm muted">300</text><text x="606" y="188" class="sm muted">400</text>
  </g>

  <g filter="url(#sh)"><rect class="card" x="879" y="338" width="505" height="326" rx="17"/></g>
  <rect x="907" y="368" width="97" height="25" rx="12" fill="#e4e8fb"/><text x="956" y="385" text-anchor="middle" font-size="11" font-weight="750" fill="#5b72e6">SUPPORTED</text>
  <text x="907" y="432" font-size="21" font-weight="700">The gain was concentrated,</text><text x="907" y="460" font-size="21" font-weight="700">not broad-based.</text>
  <text x="907" y="500" class="body muted">Community initiatives generated 43% of the</text><text x="907" y="525" class="body muted">additional visibility. Expansion announcements</text><text x="907" y="550" class="body muted">accounted for another 22%.</text>
  <path d="M907 578H1356" class="grid"/>
  <text x="907" y="608" class="cap muted">EVIDENCE</text><text x="1000" y="608" class="body">6 metrics · 14 reviewed articles</text>

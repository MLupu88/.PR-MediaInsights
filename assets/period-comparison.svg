<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>What changed since the last report?</title><desc>Compare brands, quarters, half-years or full years using the same measures.. Synthetic portfolio illustration, not a live screenshot.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1200" height="740" rx="24" fill="#f4f6fb" stroke="none"/><text x="44" y="44" font-size="12" fill="#5267dc" font-weight="700">MEDIA INSIGHTS  /  PRODUCT CASE STUDY</text><text x="44" y="96" font-size="32" fill="#17233c" font-weight="700">What changed since the last report?</text><text x="44" y="132" font-size="17" fill="#657086" font-weight="400">Compare brands, quarters, half-years or full years using the same measures.</text><rect x="44" y="188" width="360" height="156" rx="14" fill="#fff" stroke="#dce2ed"/><text x="68" y="225" font-size="19" fill="#17233c" font-weight="650">Share of Voice</text><text x="68" y="275" font-size="29" fill="#5267dc" font-weight="700">20.0% → 25.0%</text><text x="68" y="313" font-size="16" fill="#34877b" font-weight="600">+5.0 percentage points</text><rect x="420" y="188" width="360" height="156" rx="14" fill="#fff" stroke="#dce2ed"/><text x="444" y="225" font-size="19" fill="#17233c" font-weight="650">Northstar reach</text><text x="444" y="275" font-size="29" fill="#5267dc" font-weight="700">50M → 59.02M</text><text x="444" y="313" font-size="16" fill="#34877b" font-weight="600">+18.0%</text><rect x="796" y="188" width="360" height="156" rx="14" fill="#fff" stroke="#dce2ed"/><text x="820" y="225" font-size="19" fill="#17233c" font-weight="650">Median reach</text><text x="820" y="275" font-size="29" fill="#5267dc" font-weight="700">700 → 740</text><text x="820" y="313" font-size="16" fill="#34877b" font-weight="600">+5.7%</text><text x="44" y="376" font-size="16" fill="#657086" font-weight="400">Illustrative Q1 → Q2 2025 · Northstar articles: 5,000 → 5,902 · total: 25,000 → 23,608</text><rect x="44" y="410" width="538" height="234" rx="14" fill="#fff" stroke="#dce2ed"/><text x="68" y="447" font-size="19" fill="#17233c" font-weight="650">Choose the period</text><text x="68" y="481" font-size="18" fill="#657086" font-weight="400">Q1 + Q2 = H1</text><text x="68" y="520" font-size="18" fill="#657086" font-weight="400">Q3 + Q4 = H2</text><text x="68" y="559" font-size="18" fill="#657086" font-weight="400">Q1 + Q2 + Q3 + Q4 = full year</text><text x="68" y="598" font-size="18" fill="#657086" font-weight="400">Duplicate coverage excluded across projects</text><rect x="606" y="410" width="550" height="234" rx="14" fill="#fff" stroke="#dce2ed"/><text x="630" y="447" font-size="19" fill="#17233c" font-weight="650">Compare what matters</text><text x="630" y="481" font-size="18" fill="#657086" font-weight="400">Choose brands and files for each side</text><text x="630" y="520" font-size="18" fill="#657086" font-weight="400">See changes in metrics and topics</text><text x="630" y="559" font-size="18" fill="#657086" font-weight="400">Track publication and story rankings</text><text x="630" y="598" font-size="18" fill="#657086" font-weight="400">Spot new entries and reliance on a few sources</text><text x="44" y="689" font-size="17" fill="#17233c" font-weight="500">Then look at the articles to understand what drove the change.</text><text x="44" y="716" font-size="11" fill="#657086" font-weight="600">PRODUCT ILLUSTRATION · FICTIONAL DATA</text></g></svg>
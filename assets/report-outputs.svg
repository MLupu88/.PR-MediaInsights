<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img"><title>The presentation and the spreadsheet, ready to go.</title><desc>Export a project or comparison to PowerPoint and Excel.. Synthetic portfolio illustration, not a live screenshot.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1200" height="740" rx="24" fill="#f4f6fb" stroke="none"/><text x="44" y="44" font-size="12" fill="#5267dc" font-weight="700">MEDIA INSIGHTS  /  PRODUCT CASE STUDY</text><text x="44" y="96" font-size="32" fill="#17233c" font-weight="700">The presentation and the spreadsheet, ready to go.</text><text x="44" y="132" font-size="17" fill="#657086" font-weight="400">Export a project or comparison to PowerPoint and Excel.</text><rect x="44" y="185" width="538" height="427" rx="14" fill="#fff" stroke="#dce2ed"/><text x="68" y="222" font-size="19" fill="#17233c" font-weight="650">PowerPoint · example report</text><rect x="68" y="246" width="490" height="252" rx="9" fill="#f0f3fc" stroke="none"/><text x="92" y="280" font-size="13" fill="#5267dc" font-weight="700">Q2 2025 / NORTHSTAR</text><text x="92" y="326" font-size="28" fill="#17233c" font-weight="700">Coverage performance</text><text x="92" y="389" font-size="42" fill="#5267dc" font-weight="700">25.0%</text><text x="290" y="389" font-size="42" fill="#34877b" font-weight="700">59.02M</text><text x="92" y="424" font-size="16" fill="#657086" font-weight="400">Share of Voice</text><text x="290" y="424" font-size="16" fill="#657086" font-weight="400">Reach</text><text x="92" y="472" font-size="16" fill="#657086" font-weight="400">Q2 coverage · interpretation labelled</text><text x="68" y="549" font-size="17" fill="#657086" font-weight="400">Results and checked draft insights</text><text x="68" y="580" font-size="17" fill="#657086" font-weight="400">Interpretations and recommendations labelled</text><rect x="606" y="185" width="550" height="427" rx="14" fill="#fff" stroke="#dce2ed"/><text x="630" y="222" font-size="19" fill="#17233c" font-weight="650">Excel · example workbook</text><text x="630" y="284" font-size="16" fill="#17233c" font-weight="600">Article</text><text x="755" y="284" font-size="16" fill="#17233c" font-weight="400">Publication</text><text x="998" y="284" font-size="16" fill="#17233c" font-weight="400">Reach</text><rect x="630" y="301" width="502" height="1" rx="0" fill="#dce2ed" stroke="none"/><text x="630" y="336" font-size="16" fill="#17233c" font-weight="400">A-1042</text><text x="755" y="336" font-size="16" fill="#17233c" font-weight="400">City Ledger</text><text x="998" y="336" font-size="16" fill="#17233c" font-weight="400">18,400</text><rect x="630" y="353" width="502" height="1" rx="0" fill="#dce2ed" stroke="none"/><text x="630" y="388" font-size="16" fill="#17233c" font-weight="400">A-1051</text><text x="755" y="388" font-size="16" fill="#17233c" font-weight="400">Retail Brief</text><text x="998" y="388" font-size="16" fill="#17233c" font-weight="400">9,750</text><rect x="630" y="405" width="502" height="1" rx="0" fill="#dce2ed" stroke="none"/><text x="630" y="440" font-size="16" fill="#17233c" font-weight="400">A-1068</text><text x="755" y="440" font-size="16" fill="#17233c" font-weight="400">Market Journal</text><text x="998" y="440" font-size="16" fill="#17233c" font-weight="400">32,100</text><rect x="630" y="457" width="502" height="1" rx="0" fill="#dce2ed" stroke="none"/><text x="630" y="549" font-size="17" fill="#657086" font-weight="400">Rankings and individual article details</text><text x="630" y="580" font-size="17" fill="#657086" font-weight="400">Source links to continue the review</text><text x="44" y="657" font-size="16" fill="#657086" font-weight="400">Each export uses a fixed view of the data. Later exports can reflect new changes.</text><text x="44" y="688" font-size="16" fill="#17233c" font-weight="600">Checked draft insights can appear in reports. Chat replies are not added automatically
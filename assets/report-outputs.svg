<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Media Insights report outputs</title>
  <desc id="desc">A synthetic presentation and enriched spreadsheet generated from the same approved Media Insights project.</desc>

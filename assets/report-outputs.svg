    <style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17233c}.muted{fill:#747c8b}.white{fill:#fff}.cap{font-size:11px;font-weight:750;letter-spacing:.08em}.sm{font-size:12px}.body{font-size:14px}.label{font-size:16px;font-weight:680}.head{font-size:25px;font-weight:730}.cell{fill:#fff;stroke:#e2e5ec}.grid{stroke:#e2e5ec}</style>

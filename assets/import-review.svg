ht="91" rx="14" fill="#fff" stroke="#dce2ed"/><text x="510" y="248" font-size="13" fill="#657086" font-weight="600">Invalid</text><text x="510" y="288" font-size="29" fill="#17233c" font-weight="700">80</text><rect x="716" y="220" width="210" height="91" rx="14" fill="#fff" stroke="#dce2ed"/><text x="734" y="248" font-size="13" fill="#657086" font-weight="600">Duplicates</text><text x="734" y="288" font-size="29" fill="#17233c" font-weight="700">312</text><rect x="940" y="220" width="210" height="91" rx="14" fill="#fff" stroke="#dce2ed"/><text x="958" y="248" font-size="13" fill="#657086" font-weight="600">Unique valid</text><text x="958" y="288" font-size="29" fill="#17233c" font-weight="700">23,608</text><rect x="44" y="342" width="538" height="334" rx="14" fill="#fff" stroke="#dce2ed"/><text x="68" y="379" font-size="19" fill="#17233c" font-weight="650">Where the record came from</text><text x="68" y="414" font-size="16" fill="#657086" font-weight="400">Workbook: northstar_coverage.xlsx</text><text x="68" y="445" font-size="16" fill="#657086" font-weight="400">Row 42 · A-1042 · original record</text><text x="68" y="476" font-size="16" fill="#657086" font-weight="400">Row 57 · A-1049 · duplicate of A-1042</text><rect x="68" y="501" width="490" height="1" rx="0" fill="#dce2ed" stroke="none"/><text x="68" y="537" font-size="16" fill="#657086" font-weight="400">Brand assigned using the file’s mapping</text><text x="68" y="572" font-size="16" fill="#657086" font-weight="400">Original values and source links retained</text><text x="68" y="607" font-size="16" fill="#657086" font-weight="400">Missing reach stays missing on the record</text><rect x="606" y="342" width="550" height="334" rx="14" fill="#fff" stroke="#dce2ed"/><text x="630" y="379" font-size="19" fill="#17233c" font-weight="650">A label worth checking</text><rect x="630" y="399" width="154" height="27" rx="13" fill="#e7ebfc" stroke="none"/><text x="642" y="418" font-size="12" fill="#5267dc" font-weight="700">PENDING REVIEW</text><text x="630" y="465" font-size="25" fill="#17233c" font-weight="650">Confidence 0.54</text><text x="630" y="508" font-size="16" fill="#657086" font-weight="400">Topic: CSR &amp; community</text><text x="630" y="540" font-size="16" fill="#657086" font-weight="400">Sentiment: positive · role: primary focus</text><text x="630" y="572" font-size="16" fill="#657086" font-weight="400">You can correct this label or flag it for review.</text><text x="630" y="641" font-size="15" fill="#657086" font-weight="400">More confident labels can be auto-approved.</text><text x="44" y="719" font-size="17" fill="#657086" font-weight="400">Auto-approved does not mean a person reviewed it. Draft insights have separate checks.</text><text x="44" y="756" font-size="11" fill="#657086" font-weight="600">PRODUCT ILLUSTRATION · FICTIONAL DATA</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">Evidence chain for a media insight</title>
  <desc id="desc">A reviewed conclusion connected to deterministic metrics and synthetic source articles, with each data type clearly labelled.</desc>
  <defs>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#17233c" flood-opacity=".09"/></filter>
    <style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17233c}.muted{fill:#747c8b}.cap{font-size:12px;font-weight:750;letter-spacing:.09em}.sm{font-size:13px}.body{font-size:15px}.label{font-size:17px;font-weight:680}.big{font-size:27px;font-weight:730}.card{fill:#fff;stroke:#dfe3eb;stroke-width:1.2}.link{fill:none;stroke:#b9c1d3;stroke-width:2}.dot{fill:#5b72e6}</style>
  </defs>
  <rect width="1440" height="650" rx="26" fill="#f5f7fb"/>
  <text x="56" y="58" class="cap" fill="#5b72e6">A CLAIM WITH RECEIPTS</text>
  <text x="56" y="98" class="big">The conclusion is the end of the trail, not the beginning.</text>
  <text x="56" y="128" class="body muted">An analyst can inspect the calculation and the articles before approving the recommendation.</text>

  <path class="link" d="M720 315V355M720 355H334V392M720 355H1106V392"/>
  <circle class="dot" cx="720" cy="355" r="5"/><circle class="dot" cx="334" cy="392" r="5"/><circle class="dot" cx="1106" cy="392" r="5"/>

  <g filter="url(#sh)"><rect class="card" x="410" y="174" width="620" height="141" rx="18"/></g>
  <rect x="438" y="198" width="126" height="26" rx="13" fill="#dff4eb"/><text x="501" y="216" text-anchor="middle" font-size="11" font-weight="750" fill="#27745f">ANALYST APPROVED</text>
  <text x="438" y="257" font-size="21" font-weight="700">Northstar's Share of Voice gain came mainly from community coverage,</text>
  <text x="438" y="286" font-size="21" font-weight="700">not from a broad increase across every topic.</text>
  <text x="956" y="216" text-anchor="end" class="cap muted">CONCLUSION</text>

  <g filter="url(#sh)"><rect class="card" x="56" y="392" width="556" height="204" rx="18"/></g>
  <text x="84" y="430" class="cap" fill="#5b72e6">DETERMINISTIC METRICS</text>
  <g transform="translate(84 457)">
    <rect width="155" height="106" rx="12" fill="#f1f3fb"/><text x="16" y="27" class="sm muted">Share of Voice</text><text x="16" y="62" class="big">24.8%</text><text x="16" y="88" class="sm" fill="#2f8a70">+3.2 pts vs Q1</text>
    <rect x="171" width="155" height="106" rx="12" fill="#f1f3fb"/><text x="187" y="27" class="sm muted">New visibility</text><text x="187" y="62" class="big">+742</text><text x="187" y="88" class="sm muted">article equivalents</text>
    <rect x="342" width="158" height="106" rx="12" fill="#f1f3fb"/><text x="358" y="27" class="sm muted">Community share</text><text x="358" y="62" class="big">43%</text><text x="358" y="88" class="sm muted">of the net gain</text>
  </g>

  <g filter="url(#sh)"><rect class="card" x="828" y="392" width="556" height="204" rx="18"/></g>
  <text x="856" y="430" class="cap" fill="#e66d50">REVIEWED SOURCE RECORDS</text>
  <g transform="translate(856 451)">
    <rect width="500" height="37" rx="8" fill="#f8f9fc"/><circle cx="16" cy="18" r="5" fill="#64b7b0"/><text x="31" y="15" class="sm" font-weight="650">City Ledger</text><text x="31" y="30" font-size="11" class="muted">Northstar funds ten neighbourhood food hubs</text><text x="466" y="23" text-anchor="end" class="sm" fill="#5b72e6">A-1042 ↗</text>
    <rect y="47" width="500" height="37" rx="8" fill="#f8f9fc"/><circle cx="16" cy="65" r="5" fill="#64b7b0"/><text x="31" y="62" class="sm" font-weight="650">Retail Brief</text><text x="31" y="77" font-size="11" class="muted">Local producers join Northstar community programme</text><text x="466" y="70" text-anchor="end" class="sm" fill="#5b72e6">A-1187 ↗</text>
    <rect y="94" width="500" height="37" rx="8" fill="#f8f9fc"/><circle cx="16" cy="112" r="5" fill="#64b7b0"/><text x="31" y="109" class="sm" font-weight="650">Market Journal</text><text x="31" y="124" font-size="11" class="muted">Retailer expands its school breakfast partnership</text><text x="466" y="117" text-anchor="end" class="sm" fill="#5b72e6">A-1231 ↗</text>
  </g>

  <rect x="628" y="403" width="184" height="32" rx="16" fill="#17233c"/><text x="720" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6 METRICS · 14 ARTICLES</text>
</svg>

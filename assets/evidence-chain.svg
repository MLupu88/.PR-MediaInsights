<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title>A checked reference is the start of judgment.</title><desc>Narrative validation compares cited evidence with the generation’s stored snapshot.. Synthetic portfolio illustration, not a live screenshot.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1200" height="710" rx="24" fill="#f4f6fb" stroke="none"/><text x="44" y="44" font-size="12" fill="#5267dc" font-weight="700">MEDIA INSIGHTS  /  PRODUCT CASE STUDY</text><text x="44" y="96" font-size="32" fill="#17233c" font-weight="700">A checked reference is the start of judgment.</text><text x="44" y="132" font-size="17" fill="#657086" font-weight="400">Narrative validation compares cited evidence with the generation’s stored snapshot.</text><rect x="44" y="185" width="1112" height="160" rx="14" fill="#fff" stroke="#dce2ed"/><text x="68" y="222" font-size="19" fill="#17233c" font-weight="650">Illustrative interpretation</text><rect x="922" y="205" width="194" height="27" rx="13" fill="#e7ebfc" stroke="none"/><text x="934" y="224" font-size="12" fill="#5267dc" font-weight="700">SYSTEM VALIDATED</text><text x="68" y="266" font-size="19" fill="#17233c" font-weight="400">Northstar has 25.0% of article volume in this reporting scope.</text><text x="68" y="299" font-size="19" fill="#17233c" font-weight="400">Its topic mix and source stories are worth reviewing before setting the next PR priority.</text><rect x="44" y="375" width="538" height="235" rx="14" fill="#fff" stroke="#dce2ed"/><text x="68" y="412" font-size="19" fill="#17233c" font-weight="650">Calculated metric</text><text x="68" y="470" font-size="42" fill="#5267dc" font-weight="700">25.0%</text><text x="68" y="496" font-size="18" fill="#17233c" font-weight="400">5,902 Northstar articles / 23,608 total</text><text x="68" y="542" font-size="16" fill="#657086" font-weight="400">Metric reference and numeric value checked</text><text x="68" y="567" font-size="16" fill="#657086" font-weight="400">against the stored source snapshot.</text><rect x="606" y="375" width="550" height="235" rx="14" fill="#fff" stroke="#dce2ed"/><text x="630" y="412" font-size="19" fill="#17233c" font-weight="650">Source evidence</text><text x="630" y="451" font-size="17" fill="#657086" font-weight="400">A-1042 · City Ledger</text><text x="630" y="482" font-size="17" fill="#657086" font-weight="400">Northstar opens neighbourhood food hubs</text><text x="630" y="513" font-size="17" fill="#657086" font-weight="400">Publication, article ID and available URL</text><text x="630" y="544" font-size="17" fill="#657086" font-weight="400">must belong to the bounded evidence pool.</text><text x="44" y="651" font-size="18" fill="#17233c" font-weight="600">System validation does not establish causation or replace an analyst’s assessment.</text><text x="44" y="686" font-size="11" fill="#657086" font-weight="600">ILLUSTRATIVE COMPOSITION · FICTIONAL DATA · INDEPENDENT STYLING</text></g></svg>
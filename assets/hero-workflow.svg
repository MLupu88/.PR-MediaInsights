<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">From media workbooks to a supported report</title>
  <desc id="desc">An animated four-stage Media Insights workflow: raw files, a trusted dataset, comparative analysis, and evidence-backed reporting.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#13213b" flood-opacity=".10"/>
    </filter>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f9fd"/>
      <stop offset="1" stop-color="#eef1fb"/>
    </linearGradient>
    <style>
      text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17233c}
      .muted{fill:#6d7584}.white{fill:#fff}.tiny{font-size:13px;font-weight:650;letter-spacing:.08em}.label{font-size:15px;font-weight:650}.body{font-size:16px}.metric{font-size:28px;font-weight:720}.heading{font-size:30px;font-weight:720}.panel{fill:#fff;stroke:#dfe3ed;stroke-width:1.5}.flow{stroke:#5b72e6;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 10;animation:dash 12s linear infinite}.pulse{animation:pulse 12s ease-in-out infinite}.rise{animation:rise 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.fade{animation:fade 12s ease-in-out infinite}.bar{animation:grow 12s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
      @keyframes dash{to{stroke-dashoffset:-204}}@keyframes pulse{0%,7%{opacity:.25}14%,86%{opacity:1}100%{opacity:.25}}@keyframes rise{0%,8%{opacity:.45;transform:translateY(8px)}18%,92%{opacity:1;transform:none}100%{opacity:.45}}@keyframes fade{0%,14%{opacity:.35}26%,94%{opacity:1}100%{opacity:.35}}@keyframes grow{0%,22%{transform:scaleX(.2)}38%,92%{transform:scaleX(1)}100%{transform:scaleX(.2)}}
    </style>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#wash)"/>
  <circle cx="1320" cy="74" r="116" fill="#e66d50" opacity=".08"/>
  <circle cx="83" cy="690" r="158" fill="#64b7b0" opacity=".10"/>

  <text x="72" y="76" class="tiny" fill="#5b72e6">MEDIA INSIGHTS · A REPORTING PROJECT</text>
  <text x="72" y="124" class="heading">One reporting context, from source file to final recommendation.</text>
  <text x="72" y="158" class="body muted">Every number stays connected to the records and decisions that produced it.</text>

  <path class="flow" d="M332 389H397M693 389H758M1054 389H1119" fill="none"/>
  <circle class="pulse" cx="364" cy="389" r="6" fill="#e66d50"/>
  <circle class="pulse" cx="725" cy="389" r="6" fill="#e66d50" style="animation-delay:1.4s"/>
  <circle class="pulse" cx="1086" cy="389" r="6" fill="#e66d50" style="animation-delay:2.8s"/>

  <g filter="url(#shadow)">
    <rect class="panel" x="72" y="222" width="260" height="382" rx="18"/>
    <rect x="72" y="222" width="260" height="8" rx="4" fill="#e66d50"/>
  </g>
  <text x="98" y="270" class="tiny muted">01 · COLLECT</text>
  <text x="98" y="306" class="label">Raw workbooks</text>
  <g class="rise">
    <rect x="98" y="337" width="208" height="62" rx="10" fill="#f7f8fb" stroke="#e0e4ed"/>
    <rect x="114" y="352" width="30" height="32" rx="5" fill="#e66d50" opacity=".14"/>
    <text x="124" y="374" font-size="15" font-weight="750" fill="#e66d50">X</text>
    <text x="156" y="362" class="label">Northstar_Q2.xlsx</text><text x="156" y="383" class="tiny muted">4,226 rows</text>
  </g>
  <g class="rise" style="animation-delay:.55s">
    <rect x="98" y="411" width="208" height="62" rx="10" fill="#f7f8fb" stroke="#e0e4ed"/>
    <rect x="114" y="426" width="30" height="32" rx="5" fill="#5b72e6" opacity=".14"/>
    <text x="124" y="448" font-size="15" font-weight="750" fill="#5b72e6">X</text>
    <text x="156" y="436" class="label">Greenline_Q2.xlsx</text><text x="156" y="457" class="tiny muted">5,104 rows</text>
  </g>
  <g class="rise" style="animation-delay:1.1s">
    <rect x="98" y="485" width="208" height="62" rx="10" fill="#f7f8fb" stroke="#e0e4ed"/>
    <rect x="114" y="500" width="30" height="32" rx="5" fill="#64b7b0" opacity=".17"/>
    <text x="124" y="522" font-size="15" font-weight="750" fill="#3f928c">X</text>
    <text x="156" y="510" class="label">MarketSquare.xlsx</text><text x="156" y="531" class="tiny muted">3,818 rows</text>
  </g>
  <text x="98" y="578" class="tiny muted">+ 3 more source files</text>

  <g filter="url(#shadow)"><rect class="panel" x="397" y="222" width="296" height="382" rx="18"/><rect x="397" y="222" width="296" height="8" rx="4" fill="#64b7b0"/></g>
  <text x="425" y="270" class="tiny muted">02 · CLEAN</text><text x="425" y="306" class="label">Trusted dataset</text>
  <g class="fade">
    <circle cx="480" cy="389" r="48" fill="none" stroke="#e7eaf1" stroke-width="13"/>
    <circle cx="480" cy="389" r="48" fill="none" stroke="#64b7b0" stroke-width="13" stroke-linecap="round" stroke-dasharray="285 302" transform="rotate(-90 480 389)"/>
    <text x="480" y="386" text-anchor="middle" class="metric">98.7%</text><text x="480" y="408" text-anchor="middle" class="tiny muted">UNIQUE</text>
    <text x="554" y="362" class="metric">23,418</text><text x="554" y="385" class="tiny muted">NORMALIZED ROWS</text>
    <rect x="425" y="470" width="240" height="1" fill="#e3e6ed"/>
    <circle cx="438" cy="508" r="5" fill="#e66d50"/><text x="454" y="514" class="body">312 duplicates flagged</text>
    <circle cx="438" cy="546" r="5" fill="#5b72e6"/><text x="454" y="552" class="body">91 unknown values preserved</text>
  </g>

  <g filter="url(#shadow)"><rect class="panel" x="758" y="222" width="296" height="382" rx="18"/><rect x="758" y="222" width="296" height="8" rx="4" fill="#5b72e6"/></g>
  <text x="786" y="270" class="tiny muted">03 · ANALYZE</text><text x="786" y="306" class="label">Comparable performance</text>
  <text x="786" y="351" class="tiny muted">SHARE OF VOICE · Q2</text>
  <text x="786" y="392" class="body">Northstar</text><rect x="872" y="375" width="144" height="20" rx="6" fill="#edf0fa"/><rect class="bar" x="872" y="375" width="126" height="20" rx="6" fill="#5b72e6"/><text x="1009" y="391" text-anchor="end" font-size="13" font-weight="700" fill="#fff">24.8%</text>
  <text x="786" y="434" class="body">Greenline</text><rect x="872" y="417" width="144" height="20" rx="6" fill="#edf0fa"/><rect class="bar" x="872" y="417" width="104" height="20" rx="6" fill="#64b7b0" style="animation-delay:.4s"/><text x="968" y="433" text-anchor="end" font-size="13" font-weight="700" fill="#fff">20.4%</text>
  <text x="786" y="476" class="body">Harbor</text><rect x="872" y="459" width="144" height="20" rx="6" fill="#edf0fa"/><rect class="bar" x="872" y="459" width="79" height="20" rx="6" fill="#e66d50" style="animation-delay:.8s"/><text x="944" y="475" text-anchor="end" font-size="13" font-weight="700" fill="#fff">15.6%</text>
  <rect x="786" y="517" width="240" height="57" rx="10" fill="#f1f3fb"/>
  <text x="802" y="541" class="tiny" fill="#5b72e6">+3.2 POINTS VS Q1</text><text x="802" y="561" font-size="13" class="muted">Driven by community coverage</text>

  <g filter="url(#shadow)"><rect class="panel" x="1119" y="222" width="249" height="382" rx="18"/><rect x="1119" y="222" width="249" height="8" rx="4" fill="#17233c"/></g>
  <text x="1147" y="270" class="tiny muted">04 · EXPLAIN &amp; REPORT</text><text x="1147" y="306" class="label">Supported finding</text>
  <g class="fade" style="animation-delay:1.5s">
    <rect x="1147" y="337" width="193" height="128" rx="12" fill="#f7f8fb" stroke="#e0e4ed"/>
    <rect x="1165" y="354" width="57" height="22" rx="11" fill="#e4e8fb"/><text x="1193" y="370" text-anchor="middle" font-size="11" font-weight="750" fill="#5b72e6">SUPPORTED</text>
    <text x="1165" y="402" class="body" font-weight="650">Visibility grew faster</text><text x="1165" y="424" class="body" font-weight="650">than article volume.</text>
    <text x="1165" y="449" font-size="12" class="muted">6 metrics · 14 source articles</text>
    <text x="1147" y="507" class="tiny muted">READY TO DELIVER</text>
    <rect x="1147" y="526" width="89" height="48" rx="9" fill="#17233c"/><text x="1191" y="556" text-anchor="middle" class="white" font-size="14" font-weight="700">.PPTX</text>
    <rect x="1251" y="526" width="89" height="48" rx="9" fill="#64b7b0"/><text x="1295" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#102f35">.XLSX</text>
  </g>

  <rect x="72" y="650" width="1296" height="56" rx="14" fill="#17233c"/>
  <text x="100" y="685" class="white" font-size="15" font-weight="650">Source records</text><text x="235" y="685" font-size="15" fill="#8f9ab2">→</text><text x="271" y="685" class="white" font-size="15" font-weight="650">Normalized data</text><text x="421" y="685" font-size="15" fill="#8f9ab2">→</text><text x="457" y="685" class="white" font-size="15" font-weight="650">Deterministic metrics</text><text x="633" y="685" font-size="15" fill="#8f9ab2">→</text><text x="669" y="685" class="white" font-size="15" font-weight="650">Reviewable interpretation</text><text x="871" y="685" font-size="15" fill="#8f9ab2">→</text><text x="907" y="685" class="white" font-size="15" font-weight="650">Analyst-approved output</text>
</svg>

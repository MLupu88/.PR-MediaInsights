<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>From the coverage files to the finished report.</title><desc>Bring in the files, find out what changed and prepare the next report.. Synthetic portfolio illustration, not a live screenshot.</desc><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="0" y="0" width="1200" height="620" rx="24" fill="#f4f6fb" stroke="none"/><text x="44" y="44" font-size="12" fill="#5267dc" font-weight="700">MEDIA INSIGHTS  /  PRODUCT CASE STUDY</text><text x="44" y="96" font-size="32" fill="#17233c" font-weight="700">From the coverage files to the finished report.</text><text x="44" y="132" font-size="17" fill="#657086" font-weight="400">Bring in the files, find out what changed and prepare the next report.</text><rect x="44" y="196" width="260" height="296" rx="14" fill="#fff" stroke="#dce2ed"/><text x="68" y="233" font-size="19" fill="#17233c" font-weight="650">Workbooks</text><rect x="44" y="196" width="260" height="5" rx="2" fill="#d66c50" stroke="none"/><text x="68" y="296" font-size="29" fill="#d66c50" font-weight="700">24,000</text><text x="68" y="345" font-size="16" fill="#657086" font-weight="400">Imported rows</text><text x="68" y="374" font-size="16" fill="#657086" font-weight="400">Across six source files</text><text x="68" y="460" font-size="12" fill="#657086" font-weight="700">01 · IMPORT</text><rect x="328" y="196" width="260" height="296" rx="14" fill="#fff" stroke="#dce2ed"/><text x="352" y="233" font-size="19" fill="#17233c" font-weight="650">Analysis</text><rect x="328" y="196" width="260" height="5" rx="2" fill="#34877b" stroke="none"/><text x="352" y="296" font-size="29" fill="#34877b" font-weight="700">23,608</text><text x="352" y="345" font-size="16" fill="#657086" font-weight="400">Unique valid articles</text><text x="352" y="374" font-size="16" fill="#657086" font-weight="400">Duplicates excluded</text><text x="352" y="460" font-size="12" fill="#657086" font-weight="700">02 · CALCULATE</text><rect x="612" y="196" width="260" height="296" rx="14" fill="#fff" stroke="#dce2ed"/><text x="636" y="233" font-size="19" fill="#17233c" font-weight="650">Conversation</text><rect x="612" y="196" width="260" height="5" rx="2" fill="#5267dc" stroke="none"/><text x="636" y="296" font-size="29" fill="#5267dc" font-weight="700">25.0%</text><text x="636" y="345" font-size="16" fill="#657086" font-weight="400">Northstar Share of Voice</text><text x="636" y="374" font-size="16" fill="#657086" font-weight="400">See supporting numbers</text><text x="636" y="460" font-size="12" fill="#657086" font-weight="700">03 · ASK</text><rect x="896" y="196" width="260" height="296" rx="14" fill="#fff" stroke="#dce2ed"/><text x="920" y="233" font-size="19" fill="#17233c" font-weight="650">Reports</text><rect x="896" y="196" width="260" height="5" rx="2" fill="#17233c" stroke="none"/><text x="920" y="296" font-size="29" fill="#17233c" font-weight="700">PPTX + XLSX</text><text x="920" y="345" font-size="16" fill="#657086" font-weight="400">Project or comparison</text><text x="920" y="374" font-size="16" fill="#657086" font-weight="400">With checked insights</text><text x="920" y="460" font-size="12" fill="#657086" font-weight="700">04 · EXPORT</text><rect x="44" y="523" width="1112" height="40" rx="10" fill="#17233c" stroke="none"/><text x="68" y="549" font-size="17" fill="#fff" font-weight="500">Keep the coverage, calculations and draft conclusions together.</text><text x="44" y="596" font-size="11" fill="#657086" font-weight="600">PRODUCT ILLUSTRATION · FICTIONAL DATA</text></g></svg>